name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release (v<VERSION>) with the DMG"
        type: boolean
        default: true
      print_snapshots:
        description: "Also print the UI snapshots (base64) into the job log"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests-linux:
    name: GIF encoder tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run GiffieCore tests
        run: swift test

  macos:
    name: Build app & DMG (macOS)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run GiffieCore tests (incl. ImageIO cross-check)
        run: swift test --filter GiffieCoreTests

      - name: Run app tests (UI logic, snapshots, live capture when permitted)
        env:
          GIFFIE_SNAPSHOT_DIR: ${{ github.workspace }}/build/snapshots
        run: swift test --filter GiffieAppTests

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Giffie-snapshots
          path: build/snapshots
          if-no-files-found: ignore

      - name: Import signing certificate (optional)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "No Developer ID certificate configured; the app will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app and DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/build-dmg.sh

      - name: Smoke-test the bundle
        run: |
          APP=build/Giffie.app
          test -x "$APP/Contents/MacOS/Giffie"
          lipo "$APP/Contents/MacOS/Giffie" -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          codesign -dv "$APP" 2>&1 | head -5
          # Launch briefly to make sure it starts without crashing.
          "$APP/Contents/MacOS/Giffie" &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Giffie exited during startup" >&2
            wait "$PID" || true
            exit 1
          fi
          # Best effort: screenshot of the first-run window (needs screen capture access on the runner).
          mkdir -p build/snapshots
          screencapture -x build/snapshots/first-launch-screen.png || echo "screencapture unavailable"
          kill "$PID"
          echo "Giffie launched and stayed running."

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Giffie-launch-screenshot
          path: build/snapshots/first-launch-screen.png
          if-no-files-found: ignore

      - name: Print UI snapshots (debug)
        if: github.event_name == 'workflow_dispatch' && inputs.print_snapshots
        run: |
          for f in build/snapshots/*; do
            echo "=== SNAPSHOT $(basename "$f")"
            base64 -i "$f" | tr -d '\n'
            echo
            echo "=== END"
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Giffie-dmg
          path: |
            build/*.dmg
            build/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          github.event_name != 'pull_request' && (
            startsWith(github.ref, 'refs/tags/v') ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
            (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DMG="build/Giffie-$VERSION.dmg"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
            # Rolling release for the current version: move it to this commit.
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag --yes
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
            gh release edit "$TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" \
              --title "Giffie $VERSION" \
              --notes-file .github/release-notes.md \
              --target "$GITHUB_SHA"
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)"
